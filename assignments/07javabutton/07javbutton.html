<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Assignment 7 - Introduction to JavaScript</title>
    <link rel="stylesheet" href="07javbutton-styles.css">
</head>
<body>
    <div id="main-content">

        <header id="main-header">
            <h1>Assignment 7</h1>
            <h2 id="subtitle">Introduction to JavaScript</h2>
        </header>

        <main id="content" class="columns">

            <section class="box" id="speech-box">
                <h3>Speech</h3>
                <p>
                    <label for="txt-speech">Type something:</label><br>
                    <input type="text" id="txt-speech" placeholder="Say something...">
                </p>
                <p>
                    <button id="btn-speech">Say It</button>
                </p>
                <p id="p-speech-output"></p>
            </section>

            <section class="box" id="shark">
                <h3>Shark</h3>
                <p>
                    <label for="sel-shark">Pick your favorite shark:</label><br>
                    <select id="sel-shark">
                        <option value=""> shark </option>
                        <option value="Coffee">Great white</option>
                        <option value="Tea">Tiger </option>
                        <option value="Juice">Lemon </option>
                        <option value="Water">Whale </option>
                    </select>
                </p>
                <p id="p-beverage-response"></p>
            </section>

            <section class="box" id="sticker-box">
                <h3>Add a Sticker</h3>
                <div id="sticker-container">
                    <span class="sticker">&#9728;&#65039;</span>
                </div>
                <p>
                    <button id="btn-add-sticker">Add Sticker</button>
                </p>
            </section>

        </main>

        <footer id="main-footer">
            <p>@portiaplante.com</p>
        </footer>

    </div>

    <script src="07javbutton.js"></script>
</body>
</html>
