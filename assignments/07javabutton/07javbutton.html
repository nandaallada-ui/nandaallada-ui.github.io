<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Assignment 7 - Introduction to JavaScript</title>
    <link rel="stylesheet" href="07javbutton-styles.css">
</head>
<body>
    <div id="main-content">

        <header id="main-header">
            <h1>Assignment 7</h1>
            <h2 id="subtitle">Introduction to JavaScript</h2>
        </header>

        <main id="content" class="columns">


            <section class="box" id="speech-box">
                <h3 id="speech-trigger">Speech</h3>
                <div id="speech-bubble-container"></div>
            </section>

            <section class="box" id="shark-box">
                <h3>Shark</h3>
                <p>
                    <label for="sel-shark">Pick your favorite shark:</label><br>
                    <select id="sel-shark">
                        <option value="">Choose a shark </option>
                        <option value="Tiger ">Tiger </option>
                        <option value="Great White ">Great white</option>
                        <option value="Whale ">Whale </option>
                        <option value="lemon ">Lemon </option>
                    </select>
                </p>
                <p id="p-shark-response"></p>
            </section>

            <section class="box" id="sticker-box">
                <h3>Add a shark sticker</h3>
                <div id="sticker-container">
                    <img id="main-sticker" class="sticker" src="../../images/fish1.png" alt="fish sticker">
                </div>
                <p>
                    <button id="btn-add-sticker">Add other fish</button>
                </p>
            </section>

        </main>

    </div>

    <script src="07javbutton.js"></script>
</body>
</html>
